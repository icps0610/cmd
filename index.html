<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 指令工具</title>
    <style>
        :root {
            --bg-color: #121212;
            --item-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #4caf50;
            --code-bg: #000000;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-controls {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .download-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #1976D2;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1600px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .item-card {
            background-color: var(--item-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .item-label {
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
            padding-right: 60px;
        }

        .code-block {
            background-color: var(--code-bg);
            padding: 10px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #dcdcdc;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: #555;
        }

        .copy-btn.copied {
            background-color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <h1><a href="https://github.com/icps0610/cmd" style="color: inherit; text-decoration: none;">常用指令</a></h1>
    <div class="header-controls">
        <button class="download-btn" onclick="downloadBatch()">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
            下載 cmd.bat
        </button>
    </div>

    <div class="grid-container" id="container"></div>

    <script>
        const commands = [
            { title: "啟動", code: `powershell "irm https://get.activated.win | iex"` },
            { title: "更新延長 (36500天)", code: `reg add "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\WindowsUpdate\\UX\\Settings" /v FlightSettingsMaxDays /t REG_DWORD /d 36500 /f` },
            { title: "關閉搜尋", code: `sc stop "WSearch" & sc config "WSearch" start= disabled` },
            { title: "關閉 UAC", code: `reg add HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System /v EnableLUA /t REG_DWORD /d 0 /f` },
            { title: "恢復舊版右鍵選單", code: `reg add "HKCU\\Software\\Classes\\CLSID\\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\\InprocServer32" /f /ve` },
            { title: "關閉無密碼登入", code: `reg add "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\PasswordLess\\Device" /v DevicePasswordLessBuildVersion /t REG_DWORD /d 0 /f` },
            { title: "帳戶設定", code: `control userpasswords2` },
            { title: "關閉 搜尋+工作檢視+小工具+聊天", code: `powershell -Command "Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search -Name SearchboxTaskbarMode -Value 0; Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name ShowTaskViewButton -Value 0; Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name TaskbarDa -Value 0; Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name TaskbarMn -Value 0"` },
            { title: "關閉顯示最近新增/最常用/最近開啟", code: `reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Start" /v HideRecentlyAddedApps /t REG_DWORD /d 1 /f & reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Start" /v HideMostUsedApps /t REG_DWORD /d 1 /f & reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v Start_TrackDocs /t REG_DWORD /d 0 /f` },
            { title: "開啟副檔名及隱藏檔案", code: `reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f & reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v Hidden /t REG_DWORD /d 1 /f & reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v ShowSuperHidden /t REG_DWORD /d 1 /f` },
            { title: "恢復副檔名", code: `reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v HideFileExt /t REG_DWORD /d 1 /f` },
            { title: "移除 Acer 程式", code: `winget uninstall --name "Acer Product Registration" & winget uninstall --name "Acer Configuration Manager" & winget uninstall --name "ControlCenter Service"` },
            { title: "移除 Microsoft Office/Hub", code: `winget uninstall --name "Microsoft 365 - zh-tw" & powershell "Get-AppPackage -AllUsers *OfficeHub* | Remove-AppxPackage -Allusers"` },
            { title: "移除微軟程式 (OneNote/OneDrive/Teams/Copilot/Dropbox)", code: `winget uninstall --name "Microsoft OneNote - zh-tw" & winget uninstall --name "Microsoft OneDrive" & winget uninstall --name "Microsoft Teams" & winget uninstall --name "Copilot" & winget uninstall --name "Dropbox 優惠方案"` },
            { title: "重設 Explorer", code: `taskkill /f /im explorer.exe & explorer` },
            { title: "開啟電源/輸入法/地區設定", code: `start ms-settings:powersleep & start ms-settings:typing & start ms-settings:regionlanguage` },
            { title: "設定 C:\\test 權限", code: `icacls "C:\\test" /grant Everyone:(OI)(CI)F /T` },
            { title: "Sysprep", code: `C:\\Windows\\System32\\Sysprep\\sysprep.exe /generalize /oobe /shutdown` },
            { title: "檢視更新的KB", code: `powershell -Command "Get-HotFix | Select HotFixID,InstalledOn"` },
            { title: "移除特定更新 (範例 KB:1234567)", code: `wusa /uninstall /kb:1234567 /quiet /norestart` },
            { title: "清除 Windows Update 快取", code: `rd /s /q %windir%\\SoftwareDistribution & md %windir%\\SoftwareDistribution` },
            { title: "關閉更新服務", code: `sc stop wuauserv & sc config wuauserv start= disabled & sc stop bits & sc config bits start= disabled & sc stop dosvc & sc config dosvc start= disabled` },
            { title: "關閉更新 (登錄檔)", code: `REG ADD "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU" /v AUOptions /t REG_DWORD /d 3 /f` },
            { title: "移除更新設定", code: `REG DELETE "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU" /v AUOptions /f` },
        ];

        const container = document.getElementById('container');
        commands.forEach(cmd => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-label">${cmd.title}</div>
                <button class="copy-btn" onclick="copyText(this)">複製</button>
                <pre class="code-block">${cmd.code}</pre>
            `;
            container.appendChild(card);
        });

        function copyText(btn) {
            const code = btn.nextElementSibling.innerText;
            navigator.clipboard.writeText(code).then(() => {
                const original = btn.innerText;
                btn.innerText = "OK";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.innerText = original;
                    btn.classList.remove("copied");
                }, 1500);
            });
        }

        const batchContent = `:: 檢視更新的KB
powershell -Command "Get-HotFix | Select HotFixID,InstalledOn"
wusa /uninstall /kb:1234567 /quiet /norestart
rd /s /q %windir%\\SoftwareDistribution 
md %windir%\\SoftwareDistribution

:: 關閉更新
sc stop wuauserv & sc config wuauserv start= disabled & sc stop bits & sc config bits start= disabled & sc stop dosvc & sc config dosvc start= disabled

:: 關閉更新
REG ADD "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU" /v AUOptions /t REG_DWORD /d 3 /f
REG DELETE "HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU" /v AUOptions /f

:: 更新延長
reg add "HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\WindowsUpdate\\UX\\Settings" /v FlightSettingsMaxDays /t REG_DWORD /d 36500 /f

:: 關閉搜尋
sc stop "WSearch" & sc config "WSearch" start= disabled

:: 關閉 UAC
reg add HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System /v EnableLUA /t REG_DWORD /d 0 /f

:: 停用 Windows 11 右鍵選單的新樣式，恢復舊版右鍵選單
reg add "HKCU\\Software\\Classes\\CLSID\\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\\InprocServer32" /f /ve

:: 關閉 Windows 裝置的無密碼登入（PasswordLess 登入）
reg add "HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\PasswordLess\\Device" /v DevicePasswordLessBuildVersion /t REG_DWORD /d 0 /f
control userpasswords2

:: 關閉 搜尋 + 工作檢視 + 小工具 + 聊天
powershell -Command "Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Search -Name SearchboxTaskbarMode -Value 0; Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name ShowTaskViewButton -Value 0; Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name TaskbarDa -Value 0; Set-ItemProperty -Path HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced -Name TaskbarMn -Value 0"

:: 關閉顯示最近新增的應用程式/顯示最常用應用程式/顯示最近開啟的項目
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Start" /v HideRecentlyAddedApps /t REG_DWORD /d 1 /f 
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Start" /v HideMostUsedApps /t REG_DWORD /d 1 /f 
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v Start_TrackDocs /t REG_DWORD /d 0 /f

:: 開啟副檔名及隱藏檔案
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v HideFileExt /t REG_DWORD /d 0 /f 
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v Hidden /t REG_DWORD /d 1 /f 
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v ShowSuperHidden /t REG_DWORD /d 1 /f

:: 恢復副檔名
reg add "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced" /v HideFileExt /t REG_DWORD /d 1 /f

:: 移除 Acer 程式
winget uninstall --name "Acer Product Registration"
winget uninstall --name "Acer Configuration Manager"
winget uninstall --name "ControlCenter Service"

:: 微軟 Office
winget uninstall --name "Microsoft 365 - zh-tw"
powershell "Get-AppPackage -AllUsers *OfficeHub* | Remove-AppxPackage -Allusers"

:: 微軟程式
winget uninstall --name "Microsoft OneNote - zh-tw"
winget uninstall --name "Microsoft OneDrive"
winget uninstall --name "Microsoft Teams"
winget uninstall --name "Copilot"
winget uninstall --name "Dropbox 優惠方案"

:: 重設
taskkill /f /im explorer.exe & explorer

:: 電源模式 
start ms-settings:powersleep

:: 設定輸入法
start ms-settings:typing
start ms-settings:regionlanguage

:: 設定權限
icacls "C:\\test" /grant Everyone:(OI)(CI)F /T

:: 啟動
powershell "irm https://get.activated.win | iex"

:: 準備sysprep
C:\\Windows\\System32\\Sysprep\\sysprep.exe /generalize /oobe /shutdown
`;

        function downloadBatch() {
            const blob = new Blob([batchContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cmd.bat';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
