<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 指令工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='%231e1e1e' stroke='%23333' stroke-width='3'/%3E%3Cpath d='M16 20 L30 32 L16 44' fill='none' stroke='%234caf50' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='34' y='41' width='16' height='6' rx='2' fill='%234caf50'/%3E%3C/svg%3E">
    <script src="commands.js"></script>
</head>
<body>
    <header class="page-header">
        <h1><a href="https://github.com/icps0610/cmd" style="color: inherit; text-decoration: none;">常用指令</a></h1>
        <div class="header-controls">
        <button class="download-btn" onclick="downloadBatch()">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
            下載 cmd.txt
        </button>
        </div>
    </header>

    <div class="grid-container" id="container"></div>

    <script>
        const commands = window.CMD_COMMANDS;

        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'CMD_SYNC_FROM_INDEX', commands: commands }, '*');
        }

        const container = document.getElementById('container');
        let activeTag = null;   // 目前用來排序的標籤；null 表示預設排序

        // 預設排序：指令內容由短到長，長度相同時依標題
        function byContent(a, b) {
            return (a.code || '').length - (b.code || '').length
                || (a.title || '').localeCompare(b.title || '', 'zh-Hant-TW');
        }

        // 標籤排序：含該標籤的指令排在最前面，其餘維持預設排序
        function getSortedCommands() {
            const list = [...commands].sort(byContent);
            if (!activeTag) return list;
            const hasTag = cmd => (cmd.tags || []).includes(activeTag);
            return [...list.filter(hasTag), ...list.filter(cmd => !hasTag(cmd))];
        }

        function toggleTagSort(tag) {
            activeTag = activeTag === tag ? null : tag;
            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCards() {
            container.innerHTML = '';
            getSortedCommands().forEach(cmd => {
                const card = document.createElement('div');
                card.className = 'item-card';

                const label = document.createElement('div');
                label.className = 'item-label';
                const titleSpan = document.createElement('span');
                titleSpan.textContent = cmd.title || '';
                label.appendChild(titleSpan);

                (cmd.tags || []).forEach(tag => {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'tag-chip' + (tag === activeTag ? ' active' : '');
                    chip.textContent = tag;
                    chip.title = tag === activeTag ? '再點一下恢復預設排序' : `點一下以「${tag}」排序`;
                    chip.onclick = () => toggleTagSort(tag);
                    label.appendChild(chip);
                });

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '複製';
                copyBtn.onclick = () => copyText(copyBtn);

                const pre = document.createElement('pre');
                pre.className = 'code-block';
                pre.textContent = cmd.code || '';

                card.appendChild(label);
                card.appendChild(copyBtn);
                card.appendChild(pre);
                container.appendChild(card);
            });
        }

        renderCards();

        function copyText(btn) {
            const code = btn.nextElementSibling.innerText;
            navigator.clipboard.writeText(code).then(() => {
                const original = btn.innerText;
                btn.innerText = "OK";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.innerText = original;
                    btn.classList.remove("copied");
                }, 1500);
            });
        }

        function downloadBatch() {
            let content = "@echo off\r\nchcp 65001 > nul\r\n\r\n";
            commands.forEach(cmd => {
                content += `:: ${cmd.title}\r\n${cmd.code}\r\n\r\n`;
            });
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cmd.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
<style>
    :root {
        --bg-color: #121212;
        --item-bg: #1e1e1e;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0a0;
        --accent: #4caf50;
        --code-bg: #000000;
        --border: #333;
    }
    body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .page-header {
        width: 100%; max-width: 1200px; display: flex;
        justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 15px; margin-bottom: 20px;
    }
    .page-header h1 { margin: 0 auto; text-align: center; }
    .header-controls { display: flex; align-items: center; }
    .download-btn {
        background-color: #2196F3;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background 0.2s;
    }
    .download-btn:hover { background-color: #1976D2; }
    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
        gap: 15px;
        width: 100%;
        max-width: 1600px;
    }
    @media (max-width: 768px) {
        .grid-container { grid-template-columns: 1fr; }
    }
    .item-card {
        background-color: var(--item-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .item-label {
        font-size: 0.95rem;
        color: var(--accent);
        margin-bottom: 8px;
        font-weight: 600;
        padding-right: 60px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
    }
    .tag-chip {
        padding: 1px 9px;
        border-radius: 0;
        font-size: 0.72rem;
        font-weight: 600;
        line-height: 1.5;
        white-space: nowrap;
        cursor: pointer;
        background: #3a3a3a;
        color: #cfcfcf;
        border: 1px solid #555;
        transition: background 0.15s, border-color 0.15s;
    }
    .tag-chip:hover { background: #4a4a4a; }
    .tag-chip.active {
        background: #8b0000;
        border-color: #b22222;
        color: #fff;
    }
    .code-block {
        background-color: var(--code-bg);
        padding: 10px;
        border-radius: 4px;
        font-family: 'Consolas', monospace;
        font-size: 0.85rem;
        color: #dcdcdc;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin: 0;
    }
    .copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 4px 12px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .copy-btn:hover { background-color: #555; }
    .copy-btn.copied { background-color: var(--accent); border-color: var(--accent); }
</style>
</html>
